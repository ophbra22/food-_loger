plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.biteflowwidgets'
version = '0.1.0'

android {
  namespace "expo.modules.biteflowwidgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions { unitTests.returnDefaultValues = true }
  lintOptions {
    abortOnError true
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}
