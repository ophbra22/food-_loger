[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodlogger"
version = "2.1.0"
description = "Food recognition, barcode nutrition lookup and private food journals with Python"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=1.26,<3",
  "argon2-cffi>=23.1,<26", "httpx>=0.27,<1", "zxing-cpp>=2.3,<4",
]

[project.optional-dependencies]
ml = ["tensorflow==2.20.0"]
postgres = ["psycopg[binary]==3.3.6"]
lite = ["ai-edge-litert==1.4.0"]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.9,<1", "build>=1,<2", "python-barcode>=0.15,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
foodlogger = "foodlogger.cli:main"
foodlogger-train = "foodlogger.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foodlogger = ["data/*.json", "data/*.tflite", "data/*.txt", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires TensorFlow and local checkpoint/data",
  "browser: requires Playwright and Chromium",
  "postgres: requires a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
