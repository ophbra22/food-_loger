services:
  - type: web
    name: foodlogger
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: FOODLOGGER_ENV
        value: production
      - key: FOODLOGGER_PROFILE
        value: free
      - key: FOODLOGGER_INFERENCE
        value: lite
      - key: FOODLOGGER_TRUSTED_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        sync: false
