name: Verify FoodLogger

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,postgres]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
      - run: python -m build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,browser]'
      - run: playwright install --with-deps chromium
      - run: pytest -m browser
        env:
          FOODLOGGER_RUN_BROWSER_TESTS: "1"

  ml-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[ml,dev]'
      - run: pytest -m integration
        env:
          FOODLOGGER_RUN_ML_TESTS: "1"
          TF_CPP_MIN_LOG_LEVEL: "2"
          TF_NUM_INTRAOP_THREADS: "2"
          TF_NUM_INTEROP_THREADS: "2"

  free-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foodlogger_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,lite,postgres]'
      - run: pytest -m 'not browser and not integration'
        env:
          FOODLOGGER_RUN_LITE_TESTS: "1"
          FOODLOGGER_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/foodlogger_test?sslmode=disable
      - run: docker build -f Dockerfile.free -t foodlogger-free .
      - run: docker run --rm foodlogger-free python -c "import importlib.util; assert importlib.util.find_spec('tensorflow') is None"
      - run: >-
          docker run --rm foodlogger-free python -c
          "import ssl;
          from foodlogger.database import Database;
          options = Database('postgresql://probe:fixture-only@database.test/postgres').connection_options;
          assert options['sslmode'] == 'verify-full';
          assert options['sslrootcert'] != 'system';
          assert ssl.create_default_context(cafile=options['sslrootcert']).cert_store_stats()['x509_ca'] > 0"
      - run: >-
          docker run --rm foodlogger-free python -c
          "import hashlib, ssl;
          from foodlogger.database import Database;
          options = Database('postgresql://probe:fixture-only@aws-1-ap-northeast-2.pooler.supabase.com/postgres').connection_options;
          assert options['sslmode'] == 'verify-full';
          roots = ssl.create_default_context(cafile=options['sslrootcert']).get_ca_certs(binary_form=True);
          assert {hashlib.sha256(c).hexdigest() for c in roots} ==
          {'807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa',
          '5f9b77951a7aa1303f9b58eea9bfa89e358cfdc15f9786ff10d4930a722c9ae2'}"
      - run: >-
          docker run --rm --memory=512m foodlogger-free python -c
          "from foodlogger.lite_classifier import LiteClassifier;
          from foodlogger.nutrition import Catalog;
          from PIL import Image;
          result = LiteClassifier(Catalog()).predict(Image.new('RGB', (256,256), 'red'));
          assert result['status'] in ('recognized', 'uncertain')"
